<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="presentation">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B4D8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00B4D8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0" stop-color="#90E0EF"/>
      <stop offset="1" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#fade)"/>
  <circle cy="6" r="6" fill="url(#dot)">
    <animate attributeName="cx" values="-10;1010" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
