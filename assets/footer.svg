<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thanks for stopping by</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#03045E"/>
      <stop offset="0.45" stop-color="#061B33"/>
      <stop offset="1" stop-color="#020C1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#00B4D8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#48CAE4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#90E0EF"/>
      <stop offset="1" stop-color="#00B4D8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#90E0EF"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#0077B6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B4D8"/>
      <stop offset="1" stop-color="#0077B6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="1000" height="170" rx="22"/></clipPath>
    <clipPath id="clipT">
      <rect x="60" y="104" height="28" width="0">
        <animate attributeName="width" dur="9.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0058;0.0115;0.0173;0.0231;0.0288;0.0346;0.0404;0.0462;0.0519;0.0577;0.0635;0.0692;0.0750;0.0808;0.0865;0.0923;0.0981;0.1038;0.1096;0.1154;0.1212;0.1269;0.1327;0.1385;0.1442;0.1500;0.1558;0.1615;0.1673;0.1731;0.1788;0.1846;0.1904;0.1962;0.2019;0.2077;0.2135;0.2192;0.2250;0.2308;0.2365;0.2423;0.2481;0.2538;0.2596;0.2654;0.2712;0.2769;0.2827;0.2885;0.2942;0.9300" values="11.6;21.2;30.8;40.4;50.0;59.6;69.2;78.8;88.4;98.0;107.6;117.2;126.8;136.4;146.0;155.6;165.2;174.8;184.4;194.0;203.6;213.2;222.8;232.4;242.0;251.6;261.2;270.8;280.4;290.0;299.6;309.2;318.8;328.4;338.0;347.6;357.2;366.8;376.4;386.0;395.6;405.2;414.8;424.4;434.0;443.6;453.2;462.8;472.4;482.0;491.6;501.2;0.0"/>
      </rect>
    </clipPath>
    <style>
      .title { font-family: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -1px; }
      .mono  { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
      .line  { font-size: 16px; fill: #CAF0F8; }
      .deco  { font-size: 110px; font-weight: 700; fill: #00B4D8; opacity: .14; }
      .rise  { animation: rise 1s cubic-bezier(.2,.7,.2,1) .1s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .bar   { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) .35s both; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .rise,.bar { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <rect width="1000" height="170" fill="url(#grid)"/>
    <rect width="1000" height="170" fill="url(#glow)"/>
    <circle cx="150" cy="150" r="90" fill="#0077B6" opacity="0.25" filter="url(#blur40)">
      <animate attributeName="cx" values="150;190;150" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- faint code motif -->
    <g>
      <text x="940" y="118" text-anchor="end" class="mono deco">&lt;/&gt;</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
    </g>

    <g class="rise">
      <text x="58" y="74" class="title" fill="url(#nameGrad)">Thanks for stopping by</text>
    </g>
    <rect class="bar" x="60" y="88" width="72" height="4" rx="2" fill="url(#barGrad)"/>

    <text x="60" y="122" class="mono line" clip-path="url(#clipT)">console.log(&quot;Let&#39;s build something great together&quot;);</text>

    <rect x="0" y="0" width="1000" height="5" fill="url(#edgeGrad)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="169" rx="22" fill="none" stroke="#00B4D8" stroke-opacity="0.22"/>
</svg>
